org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
# No resident daemons: the dev machine has 8 GB of RAM. Gradle runs in a
# single-use JVM and Kotlin compiles inside it instead of in its own daemon.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# Cargo profile used for the Rust core: release (default) or dev.
sulfur.rustProfile=release

<?xml version="1.0" encoding="UTF-8"?>
<!-- Sulfur logo: a sulfur-yellow hexagon shaded like a block seen from above
     a corner, carrying an S drawn with the hexagon's own angles. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <g stroke-width="8" stroke-linejoin="round">
    <polygon points="50,6 87.2,27.5 87.2,72.5 50,94 12.8,72.5 12.8,27.5" fill="#E2A82A" stroke="#E2A82A"/>
    <polygon points="87.2,27.5 87.2,72.5 50,94 50,49" fill="#C98A14" stroke="#C98A14"/>
    <polygon points="50,6 87.2,27.5 50,49 12.8,27.5" fill="#F6D063" stroke="#F6D063"/>
  </g>
  <polyline points="64,30 41.5,30 33.5,40 41.5,50 58.5,50 66.5,60 58.5,70 36,70"
            fill="none" stroke="#2E2200" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

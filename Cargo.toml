[workspace]
resolver = "3"
members = [
    "core/sulfur-core",
    "core/sulfur-download",
    "core/sulfur-minecraft",
    "core/sulfur-mods",
    "core/sulfur-ffi",
    "core/sulfur-bundle",
    "core/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
sulfur-core = { path = "core/sulfur-core" }
sulfur-download = { path = "core/sulfur-download" }
sulfur-minecraft = { path = "core/sulfur-minecraft" }
sulfur-mods = { path = "core/sulfur-mods" }

bytes = "1"
directories = "6"
fastrand = "2"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
iana-time-zone = "0.1"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sys-locale = "0.3"
tar = "0.4"
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.32"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Dev and test builds: full DWARF made each test binary 70-170 MB and the
# incremental cache several GB. Line tables keep file:line in backtraces;
# dependencies get none.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Hashing dominates CPU time during installs; keep it fast in dev builds too.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
